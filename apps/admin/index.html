<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>俱乐部工作台 · OpenNI</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/library.css"><link rel="stylesheet" href="/admin/operations.css"><script type="module" src="/admin/operations.js"></script></head><body>
<div class="ops-shell"><aside class="ops-sidebar"><a class="ops-club" href="/"><img id="club-logo" src="/icon.svg" alt=""><div><strong id="club-name">OpenNI</strong><small>俱乐部工作台</small></div></a><div class="ops-nav-group">日常经营</div><nav aria-label="运营工作台"><button data-workspace="overview" class="selected"><span class="nav-icon">◫</span>今日待办</button><button data-workspace="dispatch"><span class="nav-icon">↗</span>派单工作台<b id="dispatch-count">0</b></button><button data-workspace="orders"><span class="nav-icon">≡</span>全部订单</button><button data-workspace="members"><span class="nav-icon">♧</span>成员与排班</button><button data-workspace="settlements"><span class="nav-icon">▤</span>收入与结算</button><button data-workspace="disputes"><span class="nav-icon">!</span>售后处理<b id="dispute-count">0</b></button><div class="ops-nav-group">俱乐部设置</div><button data-section="services"><span class="nav-icon">▦</span>服务目录</button><button data-section="announcements"><span class="nav-icon">▧</span>俱乐部公告</button><button data-workspace="brand"><span class="nav-icon">◇</span>品牌与发布</button><button data-workspace="connection"><span class="nav-icon">⚙</span>连接与集成</button></nav><div class="ops-sidebar-footer"><a href="/demo/">打开客户端 ↗</a><a href="/guide/">经营与部署手册 ↗</a><span>由 OpenNI 提供 · MIT</span></div></aside>
<div class="ops-workspace"><header class="ops-topbar"><button id="ops-menu" aria-label="打开工作台菜单">☰</button><div><span id="workspace-label">今日待办</span><span class="topbar-separator">/</span><span id="today-label"></span></div><div class="ops-top-actions"><span id="mode-label" class="mode-label">示例工作台</span><button id="refresh-all" class="icon-button" aria-label="刷新工作台">↻</button><button id="open-connection" class="small-button">连接我的俱乐部</button><span class="operator-avatar">管</span></div></header>
<main class="ops-main"><div class="preview-banner" id="preview-banner"><span class="status-dot"></span><span>示例数据 · 只读</span><button id="connect-banner">连接后端 →</button></div><p id="global-message" role="status" hidden></p><section id="orders-panel"><div id="ops-content" tabindex="-1"></div></section>
<section id="content-panel" hidden><div class="ops-page-header"><div><h1 id="content-title">服务目录</h1></div><button class="action dark" id="create-content" hidden>新增内容</button></div><p id="content-message" role="status"></p><div id="content-list"></div></section>
</main></div></div>
<dialog id="order-drawer" class="order-drawer"><div class="drawer-header"><div><span class="eyebrow">订单与履约</span><h2 id="drawer-title">订单详情</h2></div><button id="close-order" class="icon-button" aria-label="关闭订单详情">×</button></div><div id="drawer-content"></div></dialog>
<dialog id="action-dialog" class="action-dialog"><form id="action-form"><div class="drawer-header"><div><span class="eyebrow">俱乐部操作</span><h2 id="action-title"></h2></div><button type="button" id="close-action" class="icon-button" aria-label="关闭操作表单">×</button></div><div id="action-fields" class="ops-fields"></div><p id="action-note" class="action-note"></p><p id="action-error" role="alert"></p><div class="action-footer"><button type="button" id="cancel-action" class="action soft">返回</button><button type="submit" class="action dark" id="action-submit">确认</button></div></form></dialog>
<dialog id="editor" class="editor"><form id="edit-form"><div class="editor-title"><h2 id="editor-title">编辑内容</h2><button type="button" id="close-editor" class="action soft">关闭</button></div><div id="editor-fields" class="editor-fields"></div><p id="editor-error" role="alert"></p><div class="editor-footer"><span></span><button class="action dark" type="submit">保存修改</button></div></form></dialog>
</body></html>
