<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OpenNI · 电竞俱乐部应用。">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="北岸电竞">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>OpenNI Club · 北岸电竞</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,body{margin:0;background:#f5f6f8;color:#171b21;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #openni-boot{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:#f5f6f8}
    #openni-boot img{width:52px;height:52px;border-radius:15px}#openni-boot p{margin:0;font-size:16px;color:#5e6673}
    #openni-boot .track{width:88px;height:4px;border-radius:4px;background:#dfe3e9;animation:boot-pulse 1.4s ease-in-out infinite alternate}
    #openni-boot button{background:none;border:0;font:inherit;font-size:14px;color:#5e6673;min-height:44px;padding:0 18px;cursor:pointer}
    @keyframes boot-pulse{to{opacity:.45}}@media(prefers-reduced-motion:reduce){#openni-boot .track{animation:none}}
  </style>
</head>
<body>
  <section id="openni-boot" role="status" aria-live="polite">
    <img src="assets/assets/brand/logo.png" alt="" onerror="this.hidden=true">
    <p id="openni-boot-title">正在打开俱乐部</p>
    <div class="track" aria-hidden="true"></div>
    <button type="button" onclick="location.reload()">重新加载</button>
  </section>
  <script>
    window.addEventListener('flutter-first-frame',()=>document.getElementById('openni-boot')?.remove(),{once:true});
    fetch('assets/assets/brand.json').then(r=>r.ok?r.json():null).then(brand=>{const title=document.getElementById('openni-boot-title');if(title&&brand?.name)title.textContent='正在打开'+brand.name}).catch(()=>{});
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async onerror="document.getElementById('openni-boot-title').textContent='加载失败，请重新加载'"></script>
</body>
</html>
