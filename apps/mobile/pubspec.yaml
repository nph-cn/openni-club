name: openni_club
description: MIT licensed white-label esports club app for iOS, Android and web preview.
publish_to: none
version: 0.2.0+2
environment:
  sdk: ^3.14.0
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  http: ^1.6.0
  fluwx: ^6.0.6
  go_router: ^18.1.4
  shared_preferences: ^2.5.4
  cupertino_ui: any
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
  assets:
    - assets/fonts/OFL.txt
    - assets/demo/
    - assets/brand.json
    - assets/catalog.json
    - assets/brand/
    - assets/games/
